---
driver:
  name: vagrant

verifier:
  name: inspec

transport:
  name: rsync

provisioner:
  name: cinc_infra
  product_version: '18'
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true
  data_bags_path: test/integration/data_bags

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: almalinux-10

suites:
  - name: default
    run_list:
      - recipe[osl-rt-test::osl_request_tracker]
    provisioner:
      flavor_ref: 'c2.local.8c8m50d'
  - name: two-domain
    run_list:
      - recipe[osl-rt-test::two_domain]
    provisioner:
      flavor_ref: 'c2.local.8c8m50d'
  # Imports a pre-seeded older-RT database (test/cookbooks/osl-rt-test/files/rt-seed.sql.gz,
  # not committed -- see docs/migration.md) and exercises the db-upgrade path.
  - name: migration
    run_list:
      - recipe[osl-rt-test::migration]
    provisioner:
      flavor_ref: 'c2.local.8c8m50d'
    includes:
      - almalinux-9
